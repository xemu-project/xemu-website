on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
  - cron: '0 * */1 * *'

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        submodules: true
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install cssmin
    - name: Set up Python, uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v5
      with:
        python-version: "3.12"
        activate-environment: "true"
    - name: Build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEV: ${{ github.ref == 'refs/heads/master' && '0' || '1' }}
      run: |
        uv pip install -r requirements.txt
        ./build.sh
        cssmin > dist/theme.css.min < dist/theme.css
        mv dist/theme.css.min dist/theme.css
        echo "xemu.app" > dist/CNAME
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: dist
  Deploy:
    if: github.ref == 'refs/heads/master'
    needs: [Build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
